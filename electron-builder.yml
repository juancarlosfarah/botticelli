appId: com.electron.app
productName: botticelli
directories:
  buildResources: build

files:
  - out/renderer/**/*
  - out/main/**
  - out/preload/**
  - node_modules/whisper-node/**
  - resources/whisper-bin/**
  - models/**
  - package.json
  - '!**/*.map'
  - '!**/.vscode/**'
  - '!src/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!*.config.js'
  - '!{.env*,*.md,.eslint*,.prettier*}'

extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
  - from: resources/whisper-bin
    to: whisper-bin
  - from: resources/models
    to: models

asar: false

extraMetadata:
  main: out/main/index.js

win:
  executableName: botticelli

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

mac:
  identity: '-'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist.xml
  entitlementsInherit: build/entitlements.mac.plist.xml
  target:
    - dmg
  extendInfo: build/Info.plist.xml

dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
